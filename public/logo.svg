  <path d="M12 55 Q28 70 46 63 Q62 57 68 47" stroke="#FF7A00" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M16 60 Q30 74 48 68 Q62 63 70 53" stroke="#FF7A00" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5"/>

