  <path d="M14 36 Q18 38 22 42 Q20 46 18 44 Q14 42 14 38Z" fill="white" opacity="0.85"/>
  <path d="M28 42 Q32 44 36 48 Q34 52 30 50 Q26 48 26 44 Q26 40 28 42Z" fill="white" opacity="0.85"/>
  <path d="M46 38 Q50 36 54 40 Q56 44 52 46 Q48 44 46 40Z" fill="white" opacity="0.85"/>

  <!-- Swoosh curves around globe -->
