  </g>

  <!-- TripGenius wordmark -->
  <text x="82" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FF7A00" letter-spacing="-0.5">TripGenius</text>

  <!-- Tagline -->
  <text x="84" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#FF7A00" letter-spacing="2.5">YOUR TRAVEL GUIDE</text>
</svg>
