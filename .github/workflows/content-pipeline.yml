name: Daily Content Pipeline

on:
  schedule:
    - cron: '30 2 * * *'   # daily 02:30 UTC (08:00 IST)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate news articles
        id: news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx automation/news/generate.ts
        continue-on-error: true
      - name: Generate trending articles
        id: trending
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx automation/trending/generate.ts
        continue-on-error: true
      - name: Commit new content
        run: |
          git config user.name "tripgenius-automation"
          git config user.email "automation@tripgenius.in"
          git add content/news content/trending
          if ! git diff --cached --quiet; then
            git commit -m "content: daily news + trending posts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Report run to site dashboard
        if: always()
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -z "$CRON_SECRET" ] && exit 0
          if [ "${{ steps.news.outcome }}" = "success" ] && [ "${{ steps.trending.outcome }}" = "success" ]; then
            STATUS="ok"
          else
            STATUS="error"
          fi
          NEW_FILES=$(git show --stat -1 --format="" 2>/dev/null | grep -c 'content/' || echo 0)
          curl -s -X POST https://www.tripgenius.in/api/admin/log \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$STATUS" --arg d "$NEW_FILES file(s) touched in content/" \
              '{source:"content-pipeline", status:$s, title:(if $s=="ok" then "Daily content pipeline finished" else "Daily content pipeline had a failing step" end), detail:$d, url:"https://github.com/Shubhampande28/tripgenius/actions"}')"
      - name: Open / update issue on failure
        if: steps.news.outcome == 'failure' || steps.trending.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Content pipeline failure — ${date}`;
            const body = [
              `News step: ${{ steps.news.outcome == 'failure' && '**FAILED**' || 'ok' }}`,
              `Trending step: ${{ steps.trending.outcome == 'failure' && '**FAILED**' || 'ok' }}`,
              '',
              `See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) log for details.`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'content-pipeline',
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['content-pipeline'],
              });
            }
      - name: Fail the job if a generator step failed
        if: steps.news.outcome == 'failure' || steps.trending.outcome == 'failure'
        run: exit 1
