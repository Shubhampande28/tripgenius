name: SEO Watchdog

on:
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run watchdog
        id: watchdog
        run: npx tsx automation/seo-watchdog/check.ts
        continue-on-error: true
      - name: Open / update issue on critical failures
        if: steps.watchdog.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('automation/seo-watchdog/last-report.json', 'utf-8'));
            const critical = report.findings.filter(f => f.severity === 'CRITICAL');
            const date = new Date().toISOString().slice(0, 10);
            const title = `🚨 SEO Watchdog: ${critical.length} critical issues ${date}`;
            const body = [
              `Checked ${report.urlsChecked} URLs at ${report.checkedAt}.`,
              '',
              ...critical.map(f => `- [ ] **[${f.check}]** ${f.url}\n  ${f.detail}`),
              '',
              `_${report.warningCount} non-critical warnings — see the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) log._`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'seo-watchdog',
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['seo-watchdog'],
              });
            }
      - name: Fail the job if criticals were found
        if: steps.watchdog.outcome == 'failure'
        run: exit 1
